# Private Finances as one Compose stack on a shared server: the dashboard, its
# own PostgreSQL, the Telegram worker, the showcase (the invented household the
# public article is photographed against), and a `worker` service that the
# host's systemd timers run for the scheduled jobs. Nothing is published beyond the
# loopback interface; HTTPS comes from the separate edge stack in deploy/edge,
# joined through deploy/compose.edge.yaml.
#
# Configuration and credentials stay on the host under PF_CONFIG_DIR
# (/etc/private-finances, as on the systemd deployment) and are mounted
# read-only. The variables and files expected there are listed in
# docs/containers.md; none of them is in this repository.
#
#   docker compose up -d                         # dashboard, database, Telegram, showcase
#   docker compose --profile tools run --rm worker node dist/src/schedule.js <instance>
#
# Every container runs as PF_UID:PF_GID, the host's private-finances account,
# so the bind-mounted credentials keep their host permissions.
name: private-finances

x-application: &application
  image: private-finances:${PF_RELEASE:-local}
  user: '${PF_UID:-1000}:${PF_GID:-1000}'
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  # Public resolvers rather than the host's. The destination server's own
  # resolver answers SERVFAIL for some Akamai-fronted names — the broker's
  # statement host among them, found on 17 October 2026 — and every public
  # resolver answers them. Scoped to this stack; the host is left alone. The
  # repository check allows exactly these well-known resolver addresses.
  dns:
    - 1.1.1.1
    - 8.8.8.8
  volumes:
    - ${PF_CONFIG_DIR:-/etc/private-finances}:/etc/private-finances:ro
    - ${PF_STATE_DIR:-/var/lib/private-finances}/consent:/var/lib/private-finances-consent
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file:
      # POSTGRES_PASSWORD, the same password DATABASE_URL in app.env carries.
      - ${PF_CONFIG_DIR:-/etc/private-finances}/db.env
    environment:
      POSTGRES_USER: private-finances
      POSTGRES_DB: private_finances
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` on purpose. Reach the database with
    # `docker compose exec db psql -U private-finances private_finances`.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U private-finances -d private_finances']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *logging

  app:
    <<: *application
    build:
      context: .
    restart: unless-stopped
    env_file:
      - ${PF_CONFIG_DIR:-/etc/private-finances}/app.env
    environment:
      APP_MODE: postgres
      PORT: '3300'
      # The container's own address, not the host's: the port is published on
      # the host's loopback interface only (see `ports:` below).
      BIND_ADDRESS: 0.0.0.0
      RELEASE_SHA: ${PF_RELEASE:-local}
      CREDENTIALS_DIRECTORY: /etc/private-finances/credentials
      ENABLEBANKING_SESSION_DIRECTORY: /var/lib/private-finances-consent
    ports:
      # Loopback only: an SSH tunnel for the operator, the release checks,
      # and nothing else. The public name is served by the edge proxy.
      - '127.0.0.1:${PF_PORT:-3300}:3300'
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  telegram:
    <<: *application
    command: ['node', 'dist/src/telegram-cli.js']
    # The image's health check asks the dashboard's HTTP port; this process
    # has none, and a check that can only fail would make `up --wait` fail.
    healthcheck:
      disable: true
    restart: unless-stopped
    env_file:
      - ${PF_CONFIG_DIR:-/etc/private-finances}/app.env
      - ${PF_CONFIG_DIR:-/etc/private-finances}/telegram.env
    environment:
      RELEASE_SHA: ${PF_RELEASE:-local}
      CREDENTIALS_DIRECTORY: /etc/private-finances/credentials
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # The showcase: demo mode, a PGlite workspace of its own under the state
  # directory, and no configuration mounted at all — it has nothing to read
  # there (docs/showcase.md). It has no login of its own, so the edge puts a
  # password in front of its public name; PF_SHOWCASE_ORIGIN is that name and
  # the application refuses any other Host.
  showcase:
    <<: *application
    restart: unless-stopped
    environment:
      APP_MODE: demo
      PORT: '3301'
      BIND_ADDRESS: 0.0.0.0
      RELEASE_SHA: ${PF_RELEASE:-local}
      DEMO_DATA_DIR: /var/lib/private-finances-showcase/demo
      PUBLIC_ORIGIN: ${PF_SHOWCASE_ORIGIN:-}
    volumes:
      - ${PF_STATE_DIR:-/var/lib/private-finances}/showcase:/var/lib/private-finances-showcase
    ports:
      - '127.0.0.1:${PF_SHOWCASE_PORT:-3301}:3301'
    deploy:
      resources:
        limits:
          memory: 1280M

  # Refills the showcase. Run by private-finances-showcase-reseed.service on
  # the host, which stops the showcase first — PGlite allows one process per
  # data directory — and starts it again afterwards whatever happened.
  # Profile `tools`, so `up` never starts it; the memory is the seeder's.
  showcase-reseed:
    <<: *application
    profiles: [tools]
    healthcheck:
      disable: true
    restart: 'no'
    command: ['node', 'scripts/reseed-showcase.mjs']
    environment:
      APP_MODE: demo
      RELEASE_SHA: ${PF_RELEASE:-local}
      DEMO_DATA_DIR: /var/lib/private-finances-showcase/demo
      SHOWCASE_MANAGE_SERVICE: 'no'
      SHOWCASE_DROP_PRIVILEGES: 'no'
    volumes:
      - ${PF_STATE_DIR:-/var/lib/private-finances}/showcase:/var/lib/private-finances-showcase
    deploy:
      resources:
        limits:
          memory: 3G

  # Not started by `up`: the host's systemd timers run it, one short-lived
  # container per job, so a job survives a dashboard restart and a release
  # waits for it the way it waits for the systemd units today.
  worker:
    <<: *application
    profiles: [tools]
    healthcheck:
      disable: true
    restart: 'no'
    env_file:
      - ${PF_CONFIG_DIR:-/etc/private-finances}/app.env
      - ${PF_CONFIG_DIR:-/etc/private-finances}/sync.env
    environment:
      RELEASE_SHA: ${PF_RELEASE:-local}
      CREDENTIALS_DIRECTORY: /etc/private-finances/credentials
      ENABLEBANKING_SESSION_DIRECTORY: /var/lib/private-finances-consent
    volumes:
      - ${PF_CONFIG_DIR:-/etc/private-finances}:/etc/private-finances:ro
      - ${PF_STATE_DIR:-/var/lib/private-finances}/consent:/var/lib/private-finances-consent
      - ${PF_STATE_DIR:-/var/lib/private-finances}/sync:/var/lib/private-finances-sync
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata: # the database; dumped by the backup job, see docs/containers.md
