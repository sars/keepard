name: Container
# Builds the application image and starts the Compose stack against a
# disposable configuration, then asks the dashboard whether it is ready. This
# is the only place the image is exercised before a server sees it, so it runs
# on every change that could affect it; documentation-only commits skip it.
on:
  pull_request:
    paths-ignore:
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  stack:
    name: Image and stack
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PF_RELEASE: ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      # The stack reads its configuration from a host directory. This one holds
      # throwaway values that exist only for the length of the job; the layout
      # is the one docs/containers.md describes for a real host.
      - name: Prepare a disposable configuration
        run: |
          config="$RUNNER_TEMP/private-finances-config"
          state="$RUNNER_TEMP/private-finances-state"
          mkdir -p "$config/credentials" "$config/schedules" "$state/consent" "$state/sync" "$state/showcase"
          chmod 700 "$config/credentials" "$state/consent" "$state/sync" "$state/showcase"
          printf 'POSTGRES_PASSWORD=disposable-ci-only\n' > "$config/db.env"
          {
            echo 'DATABASE_URL=postgresql://private-finances:disposable-ci-only@db:5432/private_finances'
            echo 'RODION_EMAIL=rodion@example.com'
            echo 'KATYA_EMAIL=katya@example.com'
            echo 'RODION_PASSWORD=disposable-ci-only-password-1'
            echo 'KATYA_PASSWORD=disposable-ci-only-password-2'
          } > "$config/app.env"
          : > "$config/sync.env"
          : > "$config/telegram.env"
          {
            echo 'DEMO_LOGIN_EMAIL=demo@example.com'
            echo 'DEMO_LOGIN_PASSWORD=disposable-ci-only-demo-password'
          } > "$config/showcase.env"
          # Both ways, because the release rehearsal below runs as root and
          # sees only the file: the way a server does.
          {
            echo "PF_CONFIG_DIR=$config"
            echo "PF_STATE_DIR=$state"
            echo "PF_UID=$(id -u)"
            echo "PF_GID=$(id -g)"
          } | tee -a "$GITHUB_ENV" > .env
          echo "PF_RELEASE=$PF_RELEASE" >> .env
      - name: Build the image
        run: docker compose build app
      - name: Start the database, the dashboard and the showcase
        run: docker compose up -d --wait db app showcase
      - name: Ask the dashboard whether it is ready
        run: |
          curl -fsS http://127.0.0.1:3300/health/ready | tee ready.json
          grep -q '"status":"ready"' ready.json
          grep -q "\"release\":\"$PF_RELEASE\"" ready.json
      - name: Refill the showcase the way the reseed unit would
        run: |
          docker compose stop showcase
          docker compose --profile tools run --rm -e SHOWCASE_MONTHS=1 -e SHOWCASE_DENSITY=0.25 \
            showcase-reseed node scripts/seed-showcase.mjs | tee seeded.txt
          grep -qE ' [1-5] receipts$' seeded.txt
          docker compose up -d --wait showcase
          curl -fsS http://127.0.0.1:3301/health/live
      - name: Confirm the showcase asks for its sign-in
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3301/api/bootstrap)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data 'email=demo@example.com&password=wrong-password-for-the-demo' http://127.0.0.1:3301/api/login)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data 'email=demo@example.com&password=disposable-ci-only-demo-password' http://127.0.0.1:3301/api/login)" = 200
      - name: Confirm the schema was applied
        run: |
          schema=$(docker compose exec -T db psql -U private-finances -d private_finances -tAc 'select max(version) from schema_versions')
          echo "schema version $schema"
          test "$schema" -gt 0
      - name: Run a job the way a timer would
        run: |
          docker compose --profile tools run --rm worker node -e '
            const fs = require("node:fs");
            fs.accessSync("/etc/private-finances/schedules");
            fs.accessSync("/var/lib/private-finances-sync", fs.constants.W_OK);
            fs.accessSync("/var/lib/private-finances-consent", fs.constants.W_OK);
            console.log("worker mounts in place", process.version);
          '
      # The stack is now a running deployment of release ci-<sha>. The server
      # side of the release script is run against it exactly as it would be on
      # a host: as root, from an archive of the commit, with the rehearsal, the
      # pause, the switch and the verification. Only the dashboard is
      # recreated — the Telegram worker has no token here.
      - name: Rehearse a release onto the running stack
        run: |
          git archive --format=tar.gz --output "$RUNNER_TEMP/pf.tar.gz" HEAD
          digest=$(sha256sum "$RUNNER_TEMP/pf.tar.gz" | cut -d' ' -f1)
          sudo env PF_COMPOSE_DIR="$PWD" PF_PREDEPLOY_DIR="$RUNNER_TEMP/predeploy" PF_SERVICES=app \
            bash deploy/container-release-remote.sh "$GITHUB_SHA" "$RUNNER_TEMP/pf.tar.gz" "$digest"
      - name: Confirm the released commit is what answers
        run: |
          curl -fsS http://127.0.0.1:3300/health/ready | tee ready.json
          grep -q "\"release\":\"$GITHUB_SHA\"" ready.json
          grep -q "^PF_RELEASE=$GITHUB_SHA$" .env
          test "$(sudo ls "$RUNNER_TEMP/predeploy" | wc -l)" -eq 1
      # The backup, through the container: a local restic repository stands in
      # for the bucket. Two snapshots must come back — the dump and the
      # configuration — and the run must have written its own status row.
      - name: Back the stack up through the container
        run: |
          sudo apt-get install -y --no-install-recommends restic >/dev/null
          repository="$RUNNER_TEMP/restic"
          echo disposable-ci-only > "$RUNNER_TEMP/restic-password"
          restic --repo "$repository" --password-file "$RUNNER_TEMP/restic-password" init >/dev/null
          sudo env BACKUP_DATABASE_VIA=compose PF_COMPOSE_DIR="$PWD" PGDATABASE=private_finances \
            RESTIC_REPOSITORY="$repository" RESTIC_PASSWORD_FILE="$RUNNER_TEMP/restic-password" \
            BACKUP_CONFIG_PATHS="$PF_CONFIG_DIR" BACKUP_DESTINATION_LABEL=ci-local \
            bash scripts/backup.sh | tee backup.json
          grep -q '"event":"backup_completed","recorded":true,"config":true' backup.json
          # The script runs as root with a 077 umask, so the repository it
          # wrote is read back as root too.
          snapshots=$(sudo restic --repo "$repository" --password-file "$RUNNER_TEMP/restic-password" snapshots --json | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')
          test "$snapshots" -eq 2
          outcome=$(docker compose exec -T db psql -U private-finances -d private_finances -tAc "select outcome from backup_runs order by started_at desc limit 1")
          test "$outcome" = succeeded
      - name: Show the dashboard log
        if: always()
        run: docker compose logs --no-color app db | tail -80
      - name: Tear the stack down
        if: always()
        run: sudo docker compose --profile tools down --volumes --remove-orphans
